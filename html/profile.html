<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - MindX Cinema</title>
  <link rel="stylesheet" href="../styles/auth.css" />
</head>

<body>
  <div class="auth-panel">
    <h1>Profile</h1>
    <form id="profileForm">
      <div class="form-control profile-avatar-box">
        <img id="avatarPreview" src="../assets/no-image.svg" alt="avatar preview" />
        <div class="avatar-upload-row">
          <input id="avatarUpload" type="file" accept="image/*" />
          <button type="button" id="useDefaultAvatar" class="small-btn">Use default</button>
        </div>
        <div class="avatar-options">
          <label><input type="radio" name="avatar" value="../assets/no-image.svg" checked /> Default</label>
          <label><input type="radio" name="avatar" value="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=400&q=80" /> Girl 1</label>
          <label><input type="radio" name="avatar" value="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=400&q=80" /> Man 1</label>
          <label><input type="radio" name="avatar" value="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=400&q=80" /> Man 2</label>
        </div>
      </div>

      <div class="form-control">
        <input id="username" type="text" placeholder="Username" />
        <div class="error-message"></div>
      </div>

      <div class="form-control">
        <input id="email" type="email" placeholder="Email" />
        <div class="error-message"></div>
      </div>

      <div class="form-control">
        <input id="password" type="password" placeholder="Password" />
        <div class="error-message"></div>
      </div>

      <div class="form-control">
        <label class="genre-label">Favorite genres</label>
        <div class="genre-grid">
          <label><input type="checkbox" value="Action" /> Action</label>
          <label><input type="checkbox" value="Comedy" /> Comedy</label>
          <label><input type="checkbox" value="Drama" /> Drama</label>
          <label><input type="checkbox" value="Thriller" /> Thriller</label>
          <label><input type="checkbox" value="Sci-Fi" /> Sci-Fi</label>
          <label><input type="checkbox" value="Romance" /> Romance</label>
        </div>
      </div>

      <button type="submit">Save profile</button>
    </form>
    <p class="signup-text"><a href="index.html">Back to home</a></p>
  </div>

  <script src="../scripts/profile.js"></script>
</body>

</html>
