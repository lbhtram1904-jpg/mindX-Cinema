<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindX Cinema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../styles/home.css">
    <link rel="stylesheet" href="https://vdk-viber-runtime-prod.bot.botpress.host/edge/webchat.css" />
    <script src="https://vdk-viber-runtime-prod.bot.botpress.host/edge/webchat.js"></script>
    <script>
        fetch("https://vdk-viber-runtime-prod.bot.botpress.host/edge/bots/926633ce-0134-4896-9d2e-fcabe7be9bfd/config")
            .then((res) => res.json())
            .then(({ webchat }) =>
                VdkEdgeWebchat.mount({ ...webchat, mode: "bubble", baseUrl: "https://vdk-viber-runtime-prod.bot.botpress.host", botId: "926633ce-0134-4896-9d2e-fcabe7be9bfd" })
            )
    </script>
</head>

<body>
    <div class="page-shell">
        <nav class="topbar">
            <div class="brand">Mind<span>X</span> Cinema</div>
            <div class="nav-actions">
                <button class="icon-btn" aria-label="Search"><a href="search.html">⌕</a></button>
                <img id="userAvatar" src="../assets/no-image.svg" alt="user avatar"
                    style="width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.2);display:none;cursor:pointer;" />
                <button id="profileBtn" class="sign-out-btn" type="button"
                    style="background:#1f1f1f; border:1px solid rgba(255,255,255,0.18);">Profile</button>
                <button id="signOutBtn" class="sign-out-btn" type="button">Sign out</button>
            </div>
        </nav>

        <main class="hero-page">
            <section id="featuredMovie" class="featured-movie"></section>
            <section class="movie-list-wrap">
                <h2 class="section-title">Featured Picks</h2>
                <div id="movieGrid" class="movie-grid"></div>
            </section>
        </main>
    </div>

    <script src="../scripts/config.js"></script>
    <script src="../scripts/home.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
